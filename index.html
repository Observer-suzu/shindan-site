<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ドパガキ診断</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800;900&display=swap');

/* ===== 質問画面デザイン ===== */

#quiz {
padding: 15px 5px;
}

#questionNumber {
display: inline-block;
padding: 8px 16px;
color: #e9a5ff;
background: #160b2b;
border: 2px solid #a52cff;
font-family: 'Noto Sans JP', sans-serif;
box-shadow: 0 0 10px #8b20ff;
}

#quiz .progress {
height: 8px;
background: #211331;
border: 1px solid #7430b8;
border-radius: 0;
}

#quiz .progress-bar {
background: linear-gradient(90deg, #a000ff, #ff4de1);
box-shadow: 0 0 10px #d000ff;
}

#questionText {
padding: 25px 20px;
margin: 25px 0;
background: #100820;
border: 3px solid #a52cff;
border-radius: 8px;
color: #f1d9ff;
font-size: 20px;
line-height: 1.7;
box-shadow: 0 0 15px #8b20ff;
}

#choices {
display: flex;
flex-direction: column;
gap: 10px;
}

#choices .choice {
min-height: 58px;
margin: 0;
padding: 12px 16px;
background: #100820;
border: 2px solid #7430b8;
border-radius: 5px;
color: #ead5ff;
font-size: 15px;
text-align: left;
transition: 0.2s;
}

#choices .choice::before {
content: "○";
display: inline-block;
margin-right: 12px;
color: #d45aff;
font-size: 20px;
}

#choices .choice.selected {
background: linear-gradient(100deg, #7114c7, #35105c);
border-color: #edbaff;
color: white;
box-shadow: 0 0 15px #b52cff;
}

#choices .choice.selected::before {
content: "●";
color: white;
text-shadow: 0 0 8px white;
}

#nextButton {
background: linear-gradient(90deg, #941cff, #d52cff);
color: white;
border: 2px solid #e9a5ff;
border-radius: 5px;
box-shadow: 0 0 12px #a52cff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #171525;
  color: #ffffff;
  font-family: sans-serif;
}
/* ドパガキ診断・タイトル画面 */
#start {
  min-height: 0;
  height: auto;
  padding: 0;
  aspect-ratio: 16 / 9;
  position: relative;
  background-image: url("./D3CDE156-AFC8-4536-9858-5E7512139FEE.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  border-radius: 20px;
  overflow: hidden;
}

/* スマホ横向き */
@media screen and (orientation: landscape) and (max-height: 500px) {
  body {
    padding: 5px;
  }

  .container {
    padding: 5px;
  }

  #start {
    width: 100%;
    height: calc(100vh - 20px);
    max-height: calc(100vh - 20px);
    aspect-ratio: auto;
    background-size: auto 100%;
  }
}

/* タイトル画面の文字・注意書きを非表示 */
#start h1,
#start .subtitle,
#start .small {
  display: none;
}

/* 画像内のボタン位置に透明なクリック領域を配置 */
#start button {
  position: absolute;
  left: 15%;
  bottom: 9%;
  width: 70%;
  height: 65px;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: transparent;
  opacity: 0;
  cursor: pointer;
  z-index: 10;
}

.container {
  max-width: 600px;
  margin: 30px auto;
  padding: 25px;
  background: #252238;
  border-radius: 20px;
}

h1 {
  text-align: center;
  color: #ffcf70;
  font-size: 30px;
}

.subtitle {
  text-align: center;
  color: #c7c3d8;
  line-height: 1.8;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border: none;
  border-radius: 12px;
  background: #ffbd59;
  color: #211a2d;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.35;
}

.choice {
  display: block;
  width: 100%;
  margin: 10px 0;
  padding: 15px;
  background: #39334f;
  color: white;
  border: 2px solid transparent;
  border-radius: 12px;
  text-align: left;
}

.choice.selected {
  border-color: #ffbd59;
  background: #514365;
}

.progress {
  height: 9px;
  background: #454057;
  border-radius: 10px;
  margin: 20px 0;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  background: #ffbd59;
  width: 0%;
  transition: 0.3s;
}

.question {
  font-size: 21px;
  line-height: 1.7;
  margin: 25px 0;
}

.number {
  color: #ffcf70;
  font-weight: bold;
}

.result-score {
  font-size: 55px;
  text-align: center;
  color: #ffcf70;
  font-weight: bold;
  margin: 20px 0;
}

.result-title {
  text-align: center;
  font-size: 25px;
  margin-bottom: 20px;
}

.result-description {
  background: #39334f;
  padding: 18px;
  border-radius: 12px;
  line-height: 1.8;
}

.bar-row {
  margin: 18px 0;
}

.bar-label {
  display: flex;
  justify-content: space-between;
  margin-bottom: 7px;
}

.bar {
  height: 12px;
  background: #454057;
  border-radius: 10px;
  overflow: hidden;
}

.bar-fill {
  height: 100%;
  background: #ffbd59;
  border-radius: 10px;
}

.small {
  color: #aaa5bd;
  font-size: 12px;
  line-height: 1.7;
  margin-top: 25px;
}

.hidden {
  display: none;
}

#result .result-content {
position: absolute;
top: 0;
right: 0;
width: 56%;
height: 100%;
overflow-y: auto;
box-sizing: border-box;
padding: 20px 14px;
color: white;
background: rgba(10, 5, 20, 0.72);
}

#result h1 {
font-size: 21px;
}

#result h2 {
font-size: 15px;
}

#result .result-score {
font-size: 30px;
font-weight: bold;
}

#result .result-title {
font-size: 15px;
margin: 10px 0;
}

#result .result-description {
margin-top: 14px;
font-size: 14px;
line-height: 1.7;
}

#result button {
width: 100%;
font-size: 13px;
padding: 12px 5px;
}

@media (min-width: 700px) {
#result .result-content {
width: 42%;
padding: 35px;
}
}

#result .result-image {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
  z-index: 0;
  pointer-events: none;
}

#result .result-content {
  z-index: 1;
}

/* ===== Noto Sans JP ===== */
body,
button,
#result {
  font-family: 'Noto Sans JP', sans-serif;
}

/* ===== 結果画面デザイン改良 ===== */

#result .result-description {
  background: rgba(111, 35, 190, 0.72);
  border: 1px solid rgba(210, 145, 255, 0.95);
  border-radius: 12px;
  padding: 20px 16px;
  margin-top: 18px;
  line-height: 1.9;
  font-size: 14px;
  color: #f7efff;
  box-shadow: 0 0 12px rgba(195, 65, 255, 0.3);
  overflow-wrap: anywhere;
}

#result #type {
  display: block;
  color: #ffb8ed;
  font-size: 16px;
  font-weight: 800;
  margin-bottom: 16px;
}

#result #description {
  margin: 0;
  line-height: 1.9;
}

#result h1 {
  color: #e9c5ff;
  font-weight: 900;
  text-shadow: 0 0 12px rgba(170, 80, 255, 0.35);
}

#result h2 {
  color: #d9a0ff;
  font-weight: 800;
}

/* ゲージ */
#result .bar {
  height: 12px;
  background: rgba(255,255,255,0.13);
  border-radius: 20px;
  overflow: hidden;
}

#result .bar-fill {
  height: 100%;
  border-radius: 20px;
}

/* ピンク */
#result .category-0 {
  background: linear-gradient(90deg, #ff6bba, #ffb0df);
}

/* シアン */
#result .category-1 {
  background: linear-gradient(90deg, #35d9ed, #9cf5ff);
}

/* イエロー */
#result .category-2 {
  background: linear-gradient(90deg, #ffc247, #fff0a3);
}

/* パープル */
#result .category-3 {
  background: linear-gradient(90deg, #a879ff, #d8baff);
}

/* 中央のネオンライン */
#result::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 44%;
  width: 3px;
  background: #08040B;
  box-shadow:
    0 0 0px #d000ff,
    0 0 0px #d000ff,
    0 0 30px rgba(208, 0, 255, 0.7);
  z-index: 5;
  pointer-events: none;
}

/* ===== オレンジ色を紫に統一 ===== */

/* 共通ボタン */
button {
  background: linear-gradient(90deg, #57217c, #8e35b5);
  color: white;
}

/* 選択済みの選択肢 */
.choice.selected {
  border-color: #d9a0ff;
  background: #51247a;
}

/* 進捗ゲージ */
.progress-bar {
  background: linear-gradient(90deg, #8e35d5, #d45aff);
}

/* 質問番号 */
.number {
  color: #d9a0ff;
}

/* 見出し */
h1 {
  color: #e9c5ff;
  text-shadow: 0 0 8px rgba(170, 80, 255, 0.35);
}

/* 結果画面のスコア */
.result-score {
  color: #e9c5ff;
}

#backButton {
  background: linear-gradient(90deg, #351044, #612477);
  color: #e9c5ff;
  border: 1px solid #a879ff;
  box-shadow: 0 0 8px rgba(168, 121, 255, 0.3);
  margin-top: 8px;
}

</style>

</head>

<body>

<section id="start">
  <h1>ドパガキ診断</h1>
  <p class="subtitle">
    あなたの脳は刺激を求めすぎている？<br>
    20の質問から、あなたのドパガキ度を暴いて見せます😎
  </p>
  <button onclick="startQuiz()">診断を始める</button>
  <p class="small">
    ※この診断は娯楽目的のオリジナル診断です。
    医学的・心理学的な診断を行うものではありません。😈
  </p>
</section>

<section id="quiz" class="hidden">
  <div class="number" id="questionNumber"></div>
  <div class="progress">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="question" id="questionText"></div>

  <div id="choices"></div>

  <button id="nextButton" onclick="nextQuestion()" disabled>
    次へ
  </button>
  
  <button id="backButton" type="button" onclick="showBackMessage()">
    戻る
  </button>

</section>

<section id="result" class="hidden">
  
  <img id="resultImage" class="result-image" alt="診断結果のイラスト">
    
  <div class="result-content">
<h1>診断結果</h1>
<div class="result-score" id="score"></div>
<div class="result-title" id="rank"></div>
<div class="result-description">
  <strong id="type"></strong>
  <p id="description"></p>
</div>
<h2>あなたの傾向</h2>
<div id="bars"></div>
<p class="small">
  ※この結果は回答に基づく娯楽的な指標です。
  実際の脳内ドーパミン量や依存症の有無を示すものではありません。🤪
</p>
<button onclick="location.reload()">もう一度診断する</button>
  </div>
</section>

<script>

const questions = [

  // ① 刺激追求傾向
  {
    text:"普段とは違うｼｹﾞｷｯを積極的に求めちゃう♡",
    category:0
  },
  {
    text:"同じこと繰り返すよりも、次々と違うことに取り組む方が好っきゃねん！",
    category:0
  },
  {
    text:"今あるゲームより新しいゲームやアプリ、サービスが登場すると、そっちやっちゃう（例:モンハンアウトランダーズ）",
    category:0
  },
  {
    text:"刺激の少ねぇ環境はうんこの入ってねぇ便器と同じ！何か新しい刺激を！！くれえぇぇぇぇ！",
    category:0
  },
  {
    text:"いっかい興味を持っても、慣れてくると飽きてすぐ新しいものやりたくなるよなぁ？",
    category:0
  },

  // ② コンテンツ消費傾向
  {
    text:"動画見る時1.5倍速以上で見るのひよってるやついる？いねぇよなあ！（Ʊ꒭⊃Շʓ兯⊃Ɩ ıʓ？）",
    category:1
  },
  {
    text:"なっちまったんだよ……動画とか記事を見るとき、最初から最後まで見るのが面倒で、結論だけ確認して満足しちゃう身体によぉ…！",
    category:1
  },
  {
    text:"動画見終わる前に、別の動画見に行くよね。",
    category:1
  },
  {
    text:"SNS ･動画配信サービスとか、複数のコンテンツを高頻度で往復するんだネ‼️シャトルランカナ？？😁💗",
    category:1
  },
  {
    text:"1個動画じっくり楽しむより、短時間でいっぱい別の動画見まくった方がよくね？？",
    category:1
  },

  // ③ 即時報酬傾向
  {
    text:"待てばいい事あるかもしんねぇけど、ドパガキだから今すぐ得することしか選ベねぇんだ🙄🙄",
    category:2
  },
  {
    text:"欲しいものがあると、即購入しちゃうんだよなぁ……みつを。",
    category:2
  },
  {
    text:"通知とかメッセージが届くと、ほかのことをしていてもすぐに確認したくなる生き物なのさｯ。ﾍﾞｲﾋﾞｨʅ( ꈍᗜꈍ )ʃ.｡.:*ෆ←ﾊﾅﾜｸｩﾝ🫶",
    category:2
  },
  {
    text:"結果すぐ分かんないと死ぬぅ！お願いだから爆速で結果だけ教えてくれや(𖥕ᾥ𖥕)",
    category:2
  },
  {
    text:"この後予定あるけど１回だけこのゲームやるか……（1時間後）うっひょぉぉぉぉ！ゲームしてたら予定時間過ぎとるやんけ（キチゲ解放の音）",
    category:2
  },

  // ④ 注意の持続困難・退屈への弱さ
  {
    text:"なんか作業してても秒で飽きて別のことしちゃうの、なぁぜなぁぜ？",
    category:3
  },
  {
    text:"勉強･読書とか時間かかるのふつーに無理すぎて死ぬww集中力はどこカナ😅❓",
    category:3
  },
  {
    text:"なんもすることない時間耐えられない😭スマホよ、結婚してくれ。",
    category:3
  },
  {
    text:"作業中別のことしだすと次気づいたとき2.3時間たつバグまだ修正されてないんだ。いがい〜〜〜〜〜！！！！",
    category:3
  },
  {
    text:"興味うっすいこと取り組んでると、秒で飽きるのは〜〜〜？結論。有罪。死刑！！！！",
    category:3
  }

];

const categories = [
  "刺激追求傾向",
  "コンテンツ消費傾向",
  "即時報酬傾向",
  "注意の持続困難・退屈への弱さ"
];

const types = [
  {
    name:"刺激追求型",
    description:"犬みたいやねw 常に新しい刺激を求めるタイプ。何も起きない時間は退屈そのもの。脳内で次のイベントを勝手に開催している可能性があります。ガチガチ、チャッピーが言ってた。"
  },
  {
    name:"コンテンツ爆食型",
    description:"はい。暴食暴食。大罪かな？動画・SNS・ショート動画を次々と消費するタイプ。情報を得る速度は一級品。ただし、何を見たか覚えているかは別問題。いっそスマホと結婚すれば？"
  },
  {
    name:"即時報酬型",
    description:"欲しいと思ったら今すぐ欲しいタイプ。ガチャの演出、通知、購入ボタン……あなたを誘惑するものは世の中に多すぎます。目潰せば解決やね💕︎"
  },
  {
    name:"集中力迷子型",
    description:"一つのことに集中していたはずが、いつの間にか別のことをしているタイプ。気づけば目的地とは違う場所にたどり着いています。どうせマルチタスクとか言ってるんでしょ。ただのドパガキ☺️"
  }
];

let current = 0;
let answers = Array(questions.length).fill(0);

function startQuiz() {
  document.getElementById("start").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");
  showQuestion();
}

function showBackMessage() {
  alert("戻れると思った？ドパガキに過去を振り返る権利は無いよ！一生悔いてね💕︎🥰");
}
function showQuestion() {
  const q = questions[current];

  document.getElementById("questionNumber").textContent =
    "QUESTION " + (current + 1) + " / 20";

  document.getElementById("questionText").textContent = q.text;

  document.getElementById("progressBar").style.width =
    ((current) / questions.length * 100) + "%";

  const labels = [
    "常識で草",
　　　"ありますねぇ（）",
　　　"判断がムズい！🌊👺",
　　　"稀ニー",
　　　"なわけねぇだろ！〇すぞ！",
  ];

  const area = document.getElementById("choices");
  area.innerHTML = "";

  labels.forEach((label, index) => {
    const button = document.createElement("button");
    button.className = "choice";
    button.textContent = (index + 1) + "．" + label;

    if (answers[current] === index + 1) {
      button.classList.add("selected");
    }

    button.onclick = () => {
      answers[current] = index + 1;

      document.querySelectorAll(".choice").forEach(el => {
        el.classList.remove("selected");
      });

      button.classList.add("selected");
      document.getElementById("nextButton").disabled = false;
    };

    area.appendChild(button);
  });

  document.getElementById("nextButton").disabled =
    answers[current] === 0;

  document.getElementById("nextButton").textContent =
    current === 19 ? "診断結果を見る" : "次へ";
}

function nextQuestion() {
  if (answers[current] === 0) return;

  if (current < questions.length - 1) {
    current++;
    showQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById("quiz").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");

  const total = answers.reduce((a,b) => a+b, 0);
  const score = Math.round((100 - total) / 80 * 100);

  document.getElementById("score").textContent =
    score + "%";

  let rank = "";

  if (score < 20) rank = "🌱 初心者ドパガキャー";
  else if (score < 40) rank = "🐣 ドパガキ見習い";
  else if (score < 60) rank = "📱 ドパ凡人ガキ";
  else if (score < 80) rank = "⚡ 熟成ドパ大人";
  else rank = "👑 重度ドパ老害";

  document.getElementById("rank").textContent = rank;

const resultImages = [
"rank-green.PNG",
"rank-yellow.PNG",
"rank-blue.PNG",
"rank-purple.PNG",
"rank-red.PNG"
];

let imageIndex;

if (score < 20) imageIndex = 0;
else if (score < 40) imageIndex = 1;
else if (score < 60) imageIndex = 2;
else if (score < 80) imageIndex = 3;
else imageIndex = 4;

document.getElementById("resultImage").src =
  "https://raw.githubusercontent.com/Observer-suzu/shindan-site/main/" + resultImages[imageIndex];

const sums = [0,0,0,0];
  const counts = [0,0,0,0];

  questions.forEach((q,i) => {
    sums[q.category] += answers[i];
    counts[q.category]++;
  });

  const percentages = sums.map((sum,i) =>
  Math.round((counts[i] * 5 - sum) / (counts[i] * 4) * 100)
);

  const max = Math.max(...percentages);
  const typeIndex = percentages.indexOf(max);

  document.getElementById("type").textContent =
    "あなたは「" + types[typeIndex].name + "」！";

  document.getElementById("description").textContent =
    types[typeIndex].description;

  const bars = document.getElementById("bars");
  bars.innerHTML = "";

  categories.forEach((name,i) => {
    bars.innerHTML += `
      <div class="bar-row">
        <div class="bar-label">
          <span>${name}</span>
          <strong>${percentages[i]}%</strong>
        </div>
        <div class="bar">
         <div class="bar-fill category-${i}" style="width:${percentages[i]}%"></div>
        </div>
      </div>
    `;
  });

  document.getElementById("progressBar").style.width = "100%";
}

</script>

</body>
</html>
